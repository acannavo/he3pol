#-------------------------------------------------------------------------------
#   Target pressure in torr
#-------------------------------------------------------------------------------
PRESSURE			5



#-------------------------------------------------------------------------------
#   Custom cross-section
#-------------------------------------------------------------------------------
#-----------------------------------------------------------
# USERTXS: Use custom total cross-section or not.
#          Default is USERTXS=0.
#          The file name must be data/He3He4_xs.dat if USERTXS=1.
#-----------------------------------------------------------
USERTXS				0


#-----------------------------------------------------------
# USERDXS: Use custom differential cross-section or not.
#          Default is USERDXS=0.
#          The file name must be data/He3He4_dsdomega.dat if USERDXS=1.
#-----------------------------------------------------------
USERDXS				0


#-----------------------------------------------------------
# APMODE
# 0: symmetric. AP = 0 for all energy and angle
# 1: test. AP(theta) = delta(theta). All scattered goes left.
# 2: custom. require data/He3He4_ap.dat file.
#-----------------------------------------------------------
APMODE				1
